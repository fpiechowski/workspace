checks:
  - command: gofmt -l ./cmd ./internal
    exit_code: 0
    evidence: evidence-gofmt.txt
  - command: go vet ./...
    exit_code: 0
    evidence: evidence-vet.txt
  - command: env -u WORKSPACE_AGENT_ID -u WORKSPACE_SESSION_ID -u WORKSPACE_RUN_ID go test ./... -count=1 -timeout 180s
    exit_code: 0
    evidence: evidence-go-test-all.txt
  - command: go build -o /tmp/workspace-t3-removal ./cmd/workspace && python3 scripts/check-install.py /tmp/workspace-t3-removal
    exit_code: 0
    evidence: evidence-install.txt
