- command: gofmt -l ./cmd ./internal
  exit_code: 0
  evidence: evidence-gofmt.txt
- command: go vet ./...
  exit_code: 0
  evidence: evidence-vet.txt
- command: env -u WORKSPACE_AGENT_ID -u WORKSPACE_SESSION_ID -u WORKSPACE_RUN_ID go test -count=1 ./...
  exit_code: 0
  evidence: evidence-go-test-all.txt
- command: env -u WORKSPACE_AGENT_ID -u WORKSPACE_SESSION_ID -u WORKSPACE_RUN_ID WORKSPACE_TMUX_TEST=1 go test -race -count=1 ./internal/core -run 'Workflow|Integration' -timeout 90s
  exit_code: 0
  evidence: evidence-tmux-targeted.txt
