schema_version: 1
project_id: prj_01M2908Y55TCD89G78NMTKE968
runtime: tmux
clients:
  opencode:
    adapter: opencode
    launch_argv: [opencode, --auto, --model, "{model}", --prompt, "{prompt}"]
    resume_argv: [opencode, --auto, --session, "{thread_id}", --model, "{model}", --prompt, "{prompt}"]

profiles:
  thinker:
    routes:
      - {id: thinker, client: opencode, provider: openai, model: openai/gpt-5.6-sol, max_concurrency: 1}
  orchestrator:
    routes:
      - {id: orchestrator, client: opencode, provider: zai-coding-plan, model: zai-coding-plan/glm-5.3-flash, max_concurrency: 3}
  supervisor:
    routes:
      - {id: supervisor, client: opencode, provider: zai-coding-plan, model: zai-coding-plan/glm-5.3, max_concurrency: 1}
  worker:
    routes:
      - {id: worker, client: opencode, provider: deepseek, model: deepseek/deepseek-flash, max_concurrency: 3}

defaults:
  orchestrator_profile: orchestrator

workflows:
  plan-first:
    profiles:
      orchestrator: orchestrator
      planning: thinker
      implementation: worker
    max_parallel_tasks: 3
    capabilities: [tasks, phases, tasks.role.planner, tasks.role.implementer, planner_dependency]
  issue-resolution:
    profiles:
      orchestrator: orchestrator
      planning: thinker
      implementation: worker
      integration: worker
      live-testing: worker
    max_parallel_tasks: 3
    change_requests: integrated
    capabilities: [tasks, phases, tasks.role.planner, tasks.role.implementer, tasks.role.integrator, tasks.role.tester, planner_dependency, integration, live_test, change_request, release]
