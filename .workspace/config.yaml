schema_version: 1
project_id: prj_01M2908Y55TCD89G78NMTKE968
runtime: tmux

clients:
  claude:
    adapter: claude
    launch_argv: [claude, --dangerously-skip-permissions, --model, "{model}", "{prompt}"]
    resume_argv: [claude, --dangerously-skip-permissions, --resume, "{thread_id}", --model, "{model}", "{prompt}"]
  opencode:
    adapter: opencode
    launch_argv: [opencode, --auto, --model, "{model}", --prompt, "{prompt}"]
    resume_argv: [opencode, --auto, --session, "{thread_id}", --model, "{model}", --prompt, "{prompt}"]

profiles:
  thinker:
    reasoning_effort: medium
    routes:
      #- {id: sol, client: opencode, provider: openai, model: openai/gpt-6-sol, max_concurrency: 1}
      - {id: opus, client: claude, provider: anthropic, model: claude-opus-5-5, max_concurrency: 5}
  orchestrator:
    reasoning_effort: high
    routes:
      - {id: orchestrator, client: opencode, provider: zai-coding-plan, model: zai-coding-plan/glm-5.3-flash, max_concurrency: 20}
  supervisor:
    reasoning_effort: low
    routes:
      - {id: glm, client: opencode, provider: zai-coding-plan, model: zai-coding-plan/glm-5.3, max_concurrency: 3}
      #- {id: sol, client: opencode, provider: openai, model: openai/gpt-6.sol, max_concurrency: 1}
      - {id: opus, client: claude, provider: anthropic, model: claude-opus-5-5, max_concurrency: 1}
  worker:
    reasoning_effort: medium
    routes:
      - {id: deepseek, client: opencode, provider: deepseek, model: deepseek/deepseek-flash, max_concurrency: 50}
      #- {id: luna, client: opencode, provider: openai, model: openai/gpt-6-luna, max_concurrency: 3}

defaults:
  orchestrator_profile: orchestrator
  dispatcher_profile: orchestrator

workflows:
  plan-first:
    profiles:
      orchestrator: orchestrator
      planning: thinker
      implementation: worker
    max_parallel_tasks: 3
    capabilities: [tasks, phases, tasks.role.planner, tasks.role.implementer, planner_dependency]
  issue-resolution:
    profiles:
      orchestrator: orchestrator
      planning: thinker
      implementation: worker
      integration: worker
      live-testing: worker
    max_parallel_tasks: 3
    change_requests: integrated
    capabilities: [tasks, phases, tasks.role.planner, tasks.role.implementer, tasks.role.integrator, tasks.role.tester, planner_dependency, integration, live_test, change_request, release]

forge:
  adapter: github
  remote: origin
  publication: ask
